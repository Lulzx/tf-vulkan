name: ci
on: [push, pull_request]
jobs:
  desktop-vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan harness
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools mesa-vulkan-drivers
      - name: Build
        run: cmake -S . -B build && cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Python API tests
        run: PYTHONPATH=python python3 tests/conformance/test_python_api.py
